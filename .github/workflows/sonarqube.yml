name: SonarQube Analysis

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  sonarqube:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        
    - name: Install dependencies
      run: npm install
          - name: Run tests with coverage and generate reports
      run: |
        npm run test:ci
        echo "=== Checking test report files ==="
        ls -la
        ls -la coverage/
        
    - name: Validate SonarCloud Test Report Format
      run: |
        echo "=== Checking SonarCloud test report ==="
        grep -q "<testExecutions" coverage/test-report.xml && echo "✅ VALID: SonarQube XML format confirmed" || echo "⚠️ WARNING: SonarQube XML format may be incorrect"
        
    - name: SonarCloud Scan
      uses: sonarsource/sonarcloud-github-action@master
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }} 