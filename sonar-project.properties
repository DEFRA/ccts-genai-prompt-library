sonar.projectKey=qea_prompt-laibrary-v2
sonar.organization=qea
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8
sonar.projectBaseDir=.

# Source code paths
sonar.sources=src
sonar.tests=src

# Exclude patterns
sonar.exclusions="node_modules/**,build/**,dist/**,coverage/**,**/*.test.ts,**/*.test.tsx,**/__tests__/**,**/__mocks__/**"

# TypeScript configuration
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.testExecutionReportPaths=sonar-report.xml # Ensure this file is generated by your test runner
# Test coverage configurations
sonar.coverage.exclusions="**/*.test.ts,**/*.test.tsx,**/__tests__/**,**/__mocks__/**,**/types/**/*,src/test-*.ts*"
sonar.test.inclusions="**/*.test.ts,**/*.test.tsx"

# Test metrics - Adding to display the unit test metrics to display on SonarCloud
sonar.tests.reportPath=test-results
sonar.testExecutionTime=true
sonar.test.successDensity=true
sonar.test.coverage=true

# Quality gate settings
sonar.qualitygate.wait=true