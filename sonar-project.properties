sonar.projectKey=DEFRA_prompt-library
sonar.organization=defra
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8
sonar.projectBaseDir=.

# Source code paths
sonar.sources=src
sonar.tests=src

# Exclude patterns
sonar.exclusions="node_modules/**,build/**,dist/**,coverage/**,**/*.test.ts,**/*.test.tsx,**/__tests__/**,**/__mocks__/**"

# TypeScript configuration
sonar.typescript.lcov.reportPaths="coverage/lcov.info"
sonar.javascript.lcov.reportPaths="coverage/lcov.info"
# Specify the test execution report path - ensure this file exists during the build
sonar.testExecutionReportPaths="coverage/test-report.xml"

# Test coverage configurations
sonar.coverage.exclusions="**/*.test.ts,**/*.test.tsx,**/__tests__/**,**/__mocks__/**,**/types/**/*,src/test-*.ts*"
sonar.test.inclusions="**/*.test.ts,**/*.test.tsx"

# Quality gate settings
sonar.qualitygate.wait=true