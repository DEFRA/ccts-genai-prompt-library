sonar.projectKey=qea_prompt-laibrary-v2
sonar.organization=qea
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

# Source code paths
sonar.sources=src

# Exclude patterns
sonar.exclusions=node_modules/**,build/**,dist/**,coverage/**,**/*.test.ts,**/*.test.tsx

# TypeScript configuration
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Test coverage configurations
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,src/types/**/*
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx

# Quality gate settings
sonar.qualitygate.wait=true 